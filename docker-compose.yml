services:
  app:
    build: .
    image: finance-app:latest
    container_name: finance-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=/data/app.db
      - AUTH_URL=https://${DOMAIN}
      - AUTH_TRUST_HOST=true
      - AUTH_SECRET=${AUTH_SECRET}
      - INITIAL_USER_EMAIL=${INITIAL_USER_EMAIL:-}
      - INITIAL_USER_NAME=${INITIAL_USER_NAME:-}
      - INITIAL_USER_PASSWORD=${INITIAL_USER_PASSWORD:-}
    volumes:
      - app_data:/data
    expose:
      - "3000"
    networks:
      - finance

  caddy:
    image: caddy:2-alpine
    container_name: finance-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - finance

networks:
  finance:
    driver: bridge

volumes:
  app_data:
  caddy_data:
  caddy_config:
