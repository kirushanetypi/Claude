# Запасной вариант, если Xcode < 16 или не хочет открывать project.pbxproj:
#   brew install xcodegen && cd ios/Veil && xcodegen generate
name: Veil
options:
  bundleIdPrefix: local.veil
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
targets:
  Veil:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Veil
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: local.veil.browser
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
